name: RLS Verify

on:
  workflow_dispatch:

jobs:
  check-rls:
    name: Check Supabase RLS for `contents`
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Run RLS check
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: node ./scripts/check_rls.cjs
